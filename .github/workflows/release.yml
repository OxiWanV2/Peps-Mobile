name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à compiler et publier (ex. v1.0.2)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Valider le tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Tag invalide : $TAG (format attendu : v1.2.3)"
            exit 1
          fi
          VERSION="${TAG#v}"
          CORE="${VERSION%%[-+]*}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$CORE"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_ENV"

      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Installer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Préparer la signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Secrets de signature manquants : ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"
            exit 1
          fi
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Tests unitaires
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compiler la release
        run: ./gradlew --no-daemon assembleRelease -PappVersionName="$VERSION" -PappVersionCode="$VERSION_CODE"

      - name: Nettoyer les secrets
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.keystore"

      - name: Renommer l'APK
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" "PepsMobile-$TAG.apk"
          sha256sum "PepsMobile-$TAG.apk" > "PepsMobile-$TAG.apk.sha256"

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" > /dev/null 2>&1 || true
          fi
          gh release create "$TAG" \
            "PepsMobile-$TAG.apk" "PepsMobile-$TAG.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Pep's Mobile $TAG" \
            --notes "Pep's Mobile $TAG"
